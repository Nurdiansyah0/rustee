<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <!-- Gradien Rangka Luar Perisai (Emerald to Mint) -->
    <linearGradient id="fr_fav_outer" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="35%" stop-color="#10B981" />
      <stop offset="70%" stop-color="#059669" />
      <stop offset="100%" stop-color="#064E3B" />
    </linearGradient>

    <!-- Gradien Sayap di Bawah Panah (Luminous Mint/Emerald Ribbon) -->
    <linearGradient id="fr_fav_wing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A7F3D0" />
      <stop offset="35%" stop-color="#6EE7B7" />
      <stop offset="70%" stop-color="#34D399" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>

    <!-- Gradien Sayap Sisi Kanan (Faceted Crest Blade) -->
    <linearGradient id="fr_fav_wingFacet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6EE7B7" stop-opacity="0.8" />
      <stop offset="35%" stop-color="#34D399" stop-opacity="0.6" />
      <stop offset="70%" stop-color="#10B981" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#064E3B" stop-opacity="0.2" />
    </linearGradient>

    <!-- Gradien Plat Dasar Perisai Dalam -->
    <linearGradient id="fr_fav_inner" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#18181B" stop-opacity="0.95" />
      <stop offset="60%" stop-color="#121215" stop-opacity="0.98" />
      <stop offset="100%" stop-color="#09090B" />
    </linearGradient>

    <!-- Gradien 3 Batang Grafik Pertumbuhan -->
    <linearGradient id="fr_fav_bar" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#065F46" />
      <stop offset="35%" stop-color="#059669" />
      <stop offset="70%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#34D399" />
    </linearGradient>

    <!-- Gradien Panah Pertumbuhan -->
    <linearGradient id="fr_fav_arrow" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="45%" stop-color="#10B981" />
      <stop offset="85%" stop-color="#34D399" />
      <stop offset="100%" stop-color="#A7F3D0" />
    </linearGradient>

    <!-- Filter Drop Shadow & Soft Glow (SVG 1.1 Universal Standard) -->
    <filter id="fr_fav_glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3" result="blur" />
      <feOffset in="blur" dx="1" dy="3" result="offsetBlur" />
      <feFlood flood-color="#10B981" flood-opacity="0.4" result="glowColor" />
      <feComposite in="glowColor" in2="offsetBlur" operator="in" result="glow" />
      <feMerge>
        <feMergeNode in="glow" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- 1. Plat Dasar Dalam Perisai -->
  <path
    d="M 200,68 C 230,73 285,80 316,92 C 326,160 322,238 200,358 C 78,238 74,160 84,92 C 115,80 170,73 200,68 Z"
    fill="url(#fr_fav_inner)"
  />

  <!-- 2. Sayap Kanan Terpadu -->
  <path
    d="M 200,68 C 236,74 285,82 316,92 C 324,155 320,234 200,356 C 242,285 272,215 272,158 C 272,118 244,82 200,68 Z"
    fill="url(#fr_fav_wingFacet)"
    stroke="url(#fr_fav_wing)"
    stroke-width="2"
    stroke-linejoin="round"
    opacity="0.9"
  />

  <!-- 3. Sayap Lengkung di Bawah Panah -->
  <path
    d="M 205,74 C 246,84 286,98 316,118 C 298,154 270,188 236,212"
    stroke="url(#fr_fav_wing)"
    stroke-width="10"
    stroke-linecap="round"
    stroke-linejoin="round"
    fill="none"
    opacity="0.95"
  />

  <!-- 4. Rangka Luar Perisai Utama -->
  <path
    d="M 200,56 C 236,61 296,69 328,82 C 340,165 336,252 200,376 C 64,252 60,165 72,82 C 104,69 164,61 200,56 Z"
    stroke="url(#fr_fav_outer)"
    stroke-width="16"
    stroke-linecap="round"
    stroke-linejoin="round"
    fill="none"
  />

  <!-- 5. Tiga Batang Grafik Pertumbuhan -->
  <rect x="132" y="215" width="22" height="70" rx="5" fill="url(#fr_fav_bar)" />
  <rect x="166" y="170" width="22" height="115" rx="5" fill="url(#fr_fav_bar)" />
  <rect x="200" y="125" width="22" height="160" rx="5" fill="url(#fr_fav_bar)" />
  
  <line
    x1="120"
    y1="290"
    x2="234"
    y2="290"
    stroke="#27272A"
    stroke-width="3"
    stroke-linecap="round"
  />

  <!-- 6. Panah Pertumbuhan Presisi -->
  <g filter="url(#fr_fav_glow)">
    <path
      d="M 104,260 C 150,250 254,156 318,92"
      stroke="url(#fr_fav_arrow)"
      stroke-width="16"
      stroke-linecap="round"
      stroke-linejoin="round"
      fill="none"
    />
    <path
      d="M 348,62 L 296,78 L 314,96 L 332,114 Z"
      fill="url(#fr_fav_arrow)"
      stroke="url(#fr_fav_arrow)"
      stroke-width="2"
      stroke-linejoin="round"
    />
  </g>
</svg>
